[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/=lib/openzeppelin-contracts/"]
test = "tests/incentiv"
cache_path = "cache_forge"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 1000
