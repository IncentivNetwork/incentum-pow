name: Build Geth
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  linter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run Linter
        run: go run build/ci.go lint

  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run Tests
        run: go run build/ci.go test

  build:
    needs: [linter, tests]
    if: |
      always() && 
      (github.event_name == 'push' ||
      (needs.linter.result == 'success' && needs.tests.result == 'success'))

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build Geth
        run: go run build/ci.go install --static ./cmd/geth

      - name: Prepare Release Asset
        if: github.event_name == 'push'
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          FILE_NAME="geth-linux-amd64-${RELEASE_TAG}.tar.gz"

          cd build/bin
          tar -czvf "../../${FILE_NAME}" geth

          echo "RELEASE_ASSET=${FILE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Upload Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ASSET }}
          path: ${{ env.RELEASE_ASSET }}
          retention-days: 7

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: ${{ env.RELEASE_ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}